name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcpretty
        run: |
          sudo gem install xcpretty --no-document --quiet 2>&1 || { echo "error: xcpretty install failed"; exit 1; }

      - name: Install clang-format
        run: |
          brew install clang-format 2>&1 || { echo "error: clang-format install failed"; exit 1; }

      - name: Check code style (clang-format dry-run)
        run: |
          make format-check CLANG_FORMAT="$(brew --prefix clang-format)/bin/clang-format"

      - name: Run generator unit tests (Python + Hypothesis)
        run: |
          # venv isolates the pinned Hypothesis from the runner's system Python
          # (externally-managed on Homebrew; PEP 668 blocks --user installs).
          # 6.141.1 is the newest 6.x supporting the runner's Python 3.9.
          python3 -m venv .tmp/hyp-venv
          .tmp/hyp-venv/bin/pip install --quiet hypothesis==6.141.1
          .tmp/hyp-venv/bin/python -m unittest discover -s Tests/CoverageHost -v

      - name: Shellcheck build scripts
        run: |
          brew install shellcheck 2>&1 || { echo "error: shellcheck install failed"; exit 1; }
          shellcheck \
            Dependencies/build-common.sh \
            Dependencies/build-universal-deps.sh \
            Dependencies/build-phases/*.sh \
            scripts/analyze-check.sh \
            scripts/analyze-extract.sh

      - name: Build MMTabBarView.framework
        run: |
          set -o pipefail
          xcodebuild -project Dependencies/MMTabBarView/MMTabBarView/MMTabBarView.xcodeproj \
                     -scheme MMTabBarView \
                     -configuration Release \
                     -sdk macosx \
                     CODE_SIGNING_ALLOWED=NO \
                     build 2>&1 | xcpretty

      - name: Copy MMTabBarView.framework
        run: |
          SRC="build/Release/MMTabBarView.framework"
          if [ ! -d "$SRC" ]; then echo "ERROR: $SRC not found (SYMROOT set to build/)"; exit 1; fi
          cp -R "$SRC" Frameworks/MMTabBarView.framework

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config intltool || { echo "error: build tools install failed"; exit 1; }

      - name: Restore + build vendored dependencies
        uses: ./.github/actions/vendored-deps
        with:
          cache-mode: save
          log-name: build-deps

      - name: Assert universal architectures
        run: |
          set -e
          for fw in libintl libffi libpcre2-8 glib libgmodule libgobject \
                    libgthread libgio libxml2 libgpg-error libgcrypt libotr libpurple; do
            bin="Frameworks/$fw.framework/Versions/A/$fw"
            archs="$(lipo -archs "$bin")"
            echo "$fw: $archs"
            [ "$archs" = "x86_64 arm64" ] || [ "$archs" = "arm64 x86_64" ] || { echo "FAIL: $fw"; exit 1; }
          done
          nm -gU Frameworks/libpurple.framework/Versions/A/libpurple | grep -q ' _purple_core_init'

      - name: Build AIUtilities.framework (with coverage instrumentation)
        run: |
          set -o pipefail
          xcodebuild -project Frameworks/AIUtilities/AIUtilities.xcodeproj \
                     -target AIUtilities.framework \
                     -configuration Debug \
                     -sdk macosx \
                     SYMROOT="$PWD/build/DerivedData/Build/Products" \
                     OBJROOT="$PWD/build/DerivedData/Build/Intermediates" \
                     CODE_SIGNING_ALLOWED=NO \
                     CLANG_COVERAGE_MAPPING=YES \
                     CLANG_PROFILE_INSTRUMENTATION=YES \
                     build 2>&1 | xcpretty

      - name: Run smoke tests (CoverageHost)
        run: |
          set -o pipefail
          xcodebuild test \
                     -project Tests/CoverageHost/CoverageHost.xcodeproj \
                     -scheme CoverageHost \
                     -configuration Debug \
                     -sdk macosx \
                     -derivedDataPath build/DerivedData \
                     -enableCodeCoverage YES \
                     CODE_SIGNING_ALLOWED=NO \
                     2>&1 | tee build/smoke-raw.log

      - name: Upload smoke test raw log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-raw-log
          path: build/smoke-raw.log
          if-no-files-found: warn

      - name: Check code coverage threshold
        env:
          COVERAGE_THRESHOLD: 0
          DERIVED_DATA_DIR: build/DerivedData
        run: |
          make coverage-check

  analyze:
    name: Analyze (Clang Static Analyzer)
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # The full-app analyze compiles app sources that import vendored framework
      # headers (libpurple, glib, ...), so the vendored frameworks must be
      # present. The composite restores the deps cache read-only (never save: a
      # restore from a stale/torn entry must not poison the cache, and the build
      # job owns the write), then builds what's missing. Analyze never links, so
      # CODE_SIGNING_ALLOWED=NO in analyze-check.sh is sufficient — no
      # signature work on the stale ad-hoc-signed vendored bundles is needed.
      - name: Restore + build vendored dependencies
        uses: ./.github/actions/vendored-deps
        with:
          cache-mode: restore-only
          log-name: analyze-deps

      # The full app links Sparkle.framework (gitignored, downloaded by
      # Dependencies/build-phases/get-sparkle.sh, checksum-pinned). Locally it's
      # present from prior builds; on a fresh runner the build job never needs it
      # (AIUtilities/MMTabBarView don't link Sparkle), so fetch it here. The
      # script is idempotent — a no-op when the cache restored it.
      - name: Fetch Sparkle.framework
        run: |
          bash Dependencies/build-phases/get-sparkle.sh

      - name: Analyze full app
        run: |
          bash scripts/analyze-check.sh

      - name: Upload analyze log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analyze-log
          path: build/analyze.log
          if-no-files-found: warn

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full clone gives all branch history for the merge-base diff; the
          # read-only token is not persisted on the runner after checkout.
          persist-credentials: false
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          pip install --quiet semgrep==1.172.0

      - name: Scan for new findings (diff-aware vs base)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            # Baseline = merge-base with the target branch, so only lines this
            # PR actually changed are scanned. The full clone from checkout
            # already has origin/$BASE_REF; no separate fetch needed.
            BASELINE="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            # Push to main: baseline is the previous commit on main.
            BASELINE="origin/main~1"
          fi
          # p/ci is the Semgrep CI ruleset (security + correctness). --error
          # fails on findings; --baseline-commit limits failure to NEW findings
          # on changed lines, so pre-existing issues don't block.
          semgrep scan --config p/ci --baseline-commit "$BASELINE" --error --metrics=off